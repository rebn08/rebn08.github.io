<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Promo | Ing. Rolando E. Borrego Navarro</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f4f5;
      --text-main: #111111;
      --accent: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      height: 100vh;
      display: flex;
    }

    /* Animaciones de entrada */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Estructura Principal */
    .left-panel {
      flex: 1;
      padding: 5%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .right-strip {
      width: 250px;
      background-color: var(--accent);
      height: 100vh;
      position: relative;
    }

    /* Navegación lateral (Puntos) */
    .side-nav {
      position: absolute;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .nav-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nav-dot.active { background-color: var(--accent); }

    /* Redes Sociales laterales */
    .social-nav {
      position: absolute;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      color: white;
      z-index: 10;
    }
    .social-nav span {
      writing-mode: vertical-rl;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .social-nav span:hover { color: #888; }

    /* Contenido de Texto */
    .content-box {
      max-width: 500px;
      margin-left: 10%;
      animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .greeting { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .title { font-size: 5rem; font-weight: 900; line-height: 1.1; margin-bottom: 2rem; }

    /* Botones */
    .btn-group { display: flex; gap: 1rem; }
    .btn {
      padding: 1rem 2rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: 2px solid var(--accent);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .btn-dark { background-color: var(--accent); color: white; }
    .btn-dark:hover { background-color: transparent; color: var(--accent); }
    .btn-light { background-color: transparent; color: var(--accent); }
    .btn-light:hover { background-color: var(--accent); color: white; }

    /* Sección de la Imagen (Superposición) */
    .image-section {
      position: absolute;
      right: -100px; /* Cruza hacia la franja negra */
      top: 50%;
      transform: translateY(-50%);
      width: 450px;
      height: 550px;
      animation: fadeIn 1.5s ease forwards;
    }

    /* El marco negro detrás de la foto */
    .image-frame {
      position: absolute;
      top: 30px; left: -30px;
      width: 100%; height: 100%;
      border: 2px solid var(--accent);
      z-index: 1;
    }

    /* Patrón de puntos */
    .dot-pattern {
      position: absolute;
      bottom: -40px; right: -40px;
      width: 200px; height: 150px;
      background-image: radial-gradient(#999 2px, transparent 2px);
      background-size: 15px 15px;
      z-index: 2;
    }

    /* La foto en sí */
    .profile-photo {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 3;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    /* Controles de flecha */
    .slider-controls {
      position: absolute;
      bottom: -60px; left: 0;
      display: flex; gap: 1rem;
    }
    .arrow-btn {
      width: 50px; height: 35px;
      background: transparent;
      border: 2px solid var(--accent);
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      font-weight: bold;
      transition: background 0.3s;
    }
    .arrow-btn:hover { background: #e0e0e0; }

  </style>
</head>
<body>

  <!-- Puntos laterales -->
  <div class="side-nav">
    <div class="nav-dot active"></div>
    <div class="nav-dot"></div>
    <div class="nav-dot"></div>
  </div>

  <div class="left-panel">
    
    <div class="content-box">
      <p class="greeting">HOLA,</p>
      <h1 class="title">SOY<br>ROLANDO</h1>
      
      <div class="btn-group">
        <a href="#" class="btn btn-dark">DESCARGAR CV</a>
        <a href="#" class="btn btn-light">CONTACTO</a>
      </div>
    </div>

    <!-- Contenedor de la Imagen y capas -->
    <div class="image-section">
      <div class="dot-pattern"></div>
      <div class="image-frame"></div>
      <!-- CAMBIA ESTE ENLACE POR TU FOTO REAL -->
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=600&auto=format&fit=crop" alt="Ing. Rolando" class="profile-photo" id="mainPhoto">
      
      <div class="slider-controls">
        <button class="arrow-btn" onclick="animateClick()">←</button>
        <button class="arrow-btn" onclick="animateClick()">→</button>
      </div>
    </div>

  </div>

  <div class="right-strip">
    <!-- Redes sociales verticales -->
    <div class="social-nav">
      <span>GitHub</span>
      <span>LinkedIn</span>
      <span>Correo</span>
    </div>
  </div>

  <script>
    // Un pequeño script de JavaScript para darle algo de interactividad a las flechas
    function animateClick() {
      const photo = document.getElementById('mainPhoto');
      // Un efecto rápido de parpadeo para simular cambio
      photo.style.opacity = '0.5';
      setTimeout(() => {
        photo.style.opacity = '1';
      }, 200);
    }
  </script>
</body>
</html>
